[build]
  command = "npm ci && npm ci --prefix backend && npm run build --prefix backend && npm run build"
  publish = "dist"
  functions = "backend/netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
